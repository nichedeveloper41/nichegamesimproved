<!DOCTYPE html>
<html>
<head>
  <title>Game Proxy</title>
  <style>
    body { margin:0; font-family:sans-serif; background:#111; color:#eee; }
    .bar { padding:10px; background:#222; display:flex; gap:5px; }
    input { flex:1; padding:6px; border:none; border-radius:4px; }
    button { padding:6px 10px; border:none; border-radius:4px; background:#06f; color:#fff; cursor:pointer; }
    iframe { width:100%; height:90vh; border:none; background:#fff; }
  </style>
</head>
<body>
  <div class="bar">
    <input id="url" type="text" placeholder="Enter game URL or search text...">
    <button onclick="load()">Go</button>
  </div>
  <iframe id="frame" src=""></iframe>

  <script>
    function load() {
      let val = document.getElementById('url').value.trim();
      let frame = document.getElementById('frame');

      // If it looks like a URL, load it directly
      if (val.startsWith("http")) {
        frame.src = val;
      } else {
        // Otherwise, search it on DuckDuckGo
        frame.src = "https://duckduckgo.com/?q=" + encodeURIComponent(val);
      }
    }
  </script>
</body>
</html>
