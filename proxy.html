<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Mini Browser</title>
  <style>
    body { margin: 0; font-family: sans-serif; }
    #top-bar { display: flex; padding: 5px; background: #eee; }
    #top-bar input { flex: 1; padding: 5px; }
    #top-bar button { margin-left: 5px; }
    iframe { width: 100%; height: calc(100vh - 40px); border: none; }
  </style>
</head>
<body>
  <div id="top-bar">
    <button onclick="goBack()">⬅</button>
    <button onclick="goForward()">➡</button>
    <button onclick="reload()">⟳</button>
    <input id="url" placeholder="Enter URL of site that works in iframe...">
    <button onclick="go()">Go</button>
  </div>
  <iframe id="webview" src="https://example.com"></iframe>

  <script>
    const iframe = document.getElementById('webview');
    const historyStack = [];
    let currentIndex = -1;

    function go() {
      const urlInput = document.getElementById('url').value;
      if (!urlInput) return;
      let url = urlInput.startsWith('http') ? urlInput : 'https://' + urlInput;

      iframe.src = url;
      historyStack.splice(currentIndex + 1);
      historyStack.push(url);
      currentIndex++;
    }

    function goBack() {
      if (currentIndex > 0) {
        currentIndex--;
        iframe.src = historyStack[currentIndex];
      }
    }

    function goForward() {
      if (currentIndex < historyStack.length - 1) {
        currentIndex++;
        iframe.src = historyStack[currentIndex];
      }
    }

    function reload() {
      iframe.src = iframe.src;
    }
  </script>
</body>
</html>
