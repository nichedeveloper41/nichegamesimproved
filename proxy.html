<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Proxy Browser</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: url('background.png') no-repeat center center fixed;
      background-size: cover;
      font-family: Arial, sans-serif;
      color: white;
    }

    /* Browser top bar */
    .top-bar {
      display: flex;
      align-items: center;
      padding: 8px;
      background: linear-gradient(145deg, #333, #111);
      border-bottom: 2px solid #555;
      box-shadow: 0 2px 6px rgba(0,0,0,0.7);
      gap: 8px;
      z-index: 10;
    }

    .top-bar button {
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      background: linear-gradient(145deg, #555, #333);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 2px 2px 5px #111, -2px -2px 5px #555;
      transition: 0.2s;
    }

    .top-bar button:hover {
      background: linear-gradient(145deg, #666, #444);
    }

    .top-bar input {
      flex: 1;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #444;
      outline: none;
      font-size: 15px;
    }

    /* Iframe window */
    #browser-frame {
      flex: 1;
      border: none;
      width: 100%;
      background: white;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <button onclick="goBack()">⟵</button>
    <button onclick="goForward()">⟶</button>
    <button onclick="refresh()">⟳</button>
    <input type="text" id="urlInput" placeholder="Search or enter URL...">
    <button onclick="search()">Go</button>
  </div>

  <iframe id="browser-frame"></iframe>

  <script>
    const iframe = document.getElementById("browser-frame");
    const urlInput = document.getElementById("urlInput");
    let historyStack = [];
    let historyIndex = -1;

    function loadURL(url) {
      // If it's not a link, treat it as search
      if (!url.startsWith("http")) {
        url = "https://html.duckduckgo.com/html/?q=" + encodeURIComponent(url);
      }
      iframe.src = url;
      historyStack = historyStack.slice(0, historyIndex + 1);
      historyStack.push(url);
      historyIndex++;
      urlInput.value = url;
    }

    function search() {
      const query = urlInput.value.trim();
      if (query) loadURL(query);
    }

    function goBack() {
      if (historyIndex > 0) {
        historyIndex--;
        iframe.src = historyStack[historyIndex];
        urlInput.value = historyStack[historyIndex];
      }
    }

    function goForward() {
      if (historyIndex < historyStack.length - 1) {
        historyIndex++;
        iframe.src = historyStack[historyIndex];
        urlInput.value = historyStack[historyIndex];
      }
    }

    function refresh() {
      if (historyIndex >= 0) {
        iframe.src = historyStack[historyIndex];
      }
    }

    // Default page = blank
    iframe.src = "https://html.duckduckgo.com/html/";
  </script>
</body>
</html>
